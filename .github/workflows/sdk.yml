name: SDK CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ServiceRegistry.Sdk.slnx

      - name: Build
        run: dotnet build ServiceRegistry.Sdk.slnx -c "$CONFIGURATION" --no-restore

      - name: Test
        run: dotnet test ServiceRegistry.Sdk.slnx -c "$CONFIGURATION" --no-build --logger trx --results-directory TestResults

      - name: Pack
        run: dotnet pack ServiceRegistry.Sdk.slnx -c "$CONFIGURATION" --no-build -o artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      # Publishes the NuGet packages on a version tag using trusted publishing (OIDC).
      # Requires: nuget.org trusted publishing policy + NUGET_USER secret (nuget.org profile name).
      - name: NuGet login (OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
